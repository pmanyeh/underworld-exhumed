# The native port builds on Linux, macOS and Windows (docs/BUILDING.md, "Continuous
# integration"): make port (compile and link with SDL3) and make port-check (the compile-only
# measurement). Only the sources are needed: no game data, no Borland toolchain and no secrets,
# so this runs on every push and every pull request, forks included. Standalone
# font/cursor tests run without game assets; the full game is compile/link only.
name: uw1-port
on:
  push:
    paths:
      - 'uw1/**'
      - 'exhume'
      - '.gitmodules'
      - '.gitattributes'
      - 'docs/**'
      - '.github/**'
      - 'ci.toml'
      - 'Makefile'
    branches: ['**']
  pull_request:
    paths:
      - 'uw1/**'
      - 'exhume'
      - '.gitmodules'
      - '.gitattributes'
      - 'docs/**'
      - '.github/**'
      - 'ci.toml'
      - 'Makefile'
permissions:
  contents: read
concurrency:
  group: uw1-port-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends clang ninja-build pkg-config libfreetype6-dev >/dev/null
      - name: Cache SDL3 and libmt32emu
        uses: actions/cache@v6
        with:
          path: uw1/tools/libs
          key: libs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('exhume/tools/setup-libs.sh') }}
      - name: Build SDL3 and libmt32emu (when not cached), fetch Nuked OPL3
        run: |
          sh exhume/tools/setup-libs.sh uw1/tools/libs
          echo "PKG_CONFIG_PATH=$PWD/uw1/tools/libs/lib/pkgconfig" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH=$PWD/uw1/tools/libs/lib/pkgconfig sh exhume/tools/setup-sound.sh uw1/tools/nuked-opl3
      - run: make -C uw1 port
      - run: make -C uw1 port-check
      - name: Localization dataset, pipeline and catalog lookup (no game assets)
        run: |
          python3 uw1/tools/i18n/l10n.py validate
          python3 uw1/tools/i18n/validate_authority.py
          python3 uw1/tools/i18n/test_l10n.py
          python3 -m unittest discover -s uw1/tools/i18n -p test_i18n.py
          python3 uw1/tools/i18n/test_runtime.py
      - name: FreeType CJK render and cache checks (no game assets)
        run: |
          python3 uw1/tools/i18n/fetch_font.py
          LD_LIBRARY_PATH="$PWD/uw1/tools/libs/lib:${LD_LIBRARY_PATH:-}" python3 uw1/tools/i18n/test_hd_font.py
      - name: HD cursor pixels, publication and original mouse state machine
        run: |
          LD_LIBRARY_PATH="$PWD/uw1/tools/libs/lib:${LD_LIBRARY_PATH:-}" python3 uw1/tools/i18n/test_hd_cursor.py
          python3 uw1/tools/i18n/test_mouse_cursor.py
          python3 uw1/tools/i18n/test_combat_text.py --sanitize
          python3 uw1/tools/i18n/test_map_notes.py --sanitize
      - name: UTF-8 scroll flow and real FreeType logical layout (no game assets)
        run: |
          LD_LIBRARY_PATH="$PWD/uw1/tools/libs/lib:${LD_LIBRARY_PATH:-}" python3 uw1/tools/i18n/test_scroll_text.py
          LD_LIBRARY_PATH="$PWD/uw1/tools/libs/lib:${LD_LIBRARY_PATH:-}" python3 uw1/tools/i18n/test_scroll_text.py --render

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      # Emscripten, pinned to the version the web build is made with (docs/WEB.md), in ~/emsdk
      # where the Makefile's web target sources it
      - name: Cache Emscripten
        uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('exhume/tools/setup-emsdk.sh') }}-4.0.15
      - name: Install Emscripten
        run: EMSDK_VERSION=4.0.15 sh exhume/tools/setup-emsdk.sh
      - name: Cache the web libraries
        uses: actions/cache@v6
        with:
          path: uw1/tools/libs-web
          key: libs-web-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('exhume/tools/setup-libs.sh', 'exhume/tools/setup-emsdk.sh') }}-4.0.15
      - name: Build SDL3 and libmt32emu for WebAssembly (when not cached)
        run: |
          # shellcheck source=/dev/null
          . ~/emsdk/emsdk_env.sh >/dev/null 2>&1
          SETUP_WEB=1 sh exhume/tools/setup-libs.sh uw1/tools/libs-web
      - name: Fetch Nuked OPL3 (the web build has the FM music as the desktop one does)
        run: sh exhume/tools/setup-sound.sh uw1/tools/nuked-opl3
      - run: make -C uw1 web

  macos:
    # ARM hosted capacity repeatedly cancelled the prior build before any step.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      - name: Homebrew packages
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install sdl3 mt32emu pkgconf freetype
      - run: sh exhume/tools/setup-sound.sh uw1/tools/nuked-opl3
      - run: make -C uw1 port
      - run: make -C uw1 port-check
      - name: Localization dataset, pipeline and catalog lookup (no game assets)
        run: |
          python3 uw1/tools/i18n/l10n.py validate
          python3 uw1/tools/i18n/validate_authority.py
          python3 uw1/tools/i18n/test_l10n.py
          python3 -m unittest discover -s uw1/tools/i18n -p test_i18n.py
          python3 uw1/tools/i18n/test_runtime.py
      - name: FreeType CJK render and cache checks (no game assets)
        run: |
          python3 uw1/tools/i18n/fetch_font.py
          python3 uw1/tools/i18n/test_hd_font.py
      - name: HD cursor pixels, publication and original mouse state machine
        run: |
          python3 uw1/tools/i18n/test_hd_cursor.py
          python3 uw1/tools/i18n/test_mouse_cursor.py
          python3 uw1/tools/i18n/test_combat_text.py --sanitize
          python3 uw1/tools/i18n/test_map_notes.py --sanitize
      - name: UTF-8 scroll flow and real FreeType logical layout (no game assets)
        run: |
          python3 uw1/tools/i18n/test_scroll_text.py
          python3 uw1/tools/i18n/test_scroll_text.py --render

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # the scripts must keep their LF line ends for MSYS2's sh
      - run: git config --global core.autocrlf false
        shell: pwsh
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: true
      # MSYS2's CLANG64 environment: clang targeting the Universal C Runtime, SDL3 and
      # pkg-config from its packages; no libmt32emu, so the Windows build has no MT-32
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: make curl
          pacboy: clang:p llvm:p pkgconf:p sdl3:p python:p freetype:p
      - run: sh exhume/tools/setup-sound.sh uw1/tools/nuked-opl3
      - run: make -C uw1 PY=python port
      - run: make -C uw1 PY=python port-check
      - name: Localization dataset, pipeline and catalog lookup (no game assets)
        run: |
          python uw1/tools/i18n/l10n.py validate
          python uw1/tools/i18n/validate_authority.py
          python uw1/tools/i18n/test_l10n.py
          python -m unittest discover -s uw1/tools/i18n -p test_i18n.py
          python uw1/tools/i18n/test_runtime.py
      - name: FreeType CJK render and cache checks (no game assets)
        run: |
          python uw1/tools/i18n/fetch_font.py
          python uw1/tools/i18n/test_hd_font.py
      - name: HD cursor pixels, publication and original mouse state machine
        run: |
          python uw1/tools/i18n/test_hd_cursor.py
          python uw1/tools/i18n/test_mouse_cursor.py
          python uw1/tools/i18n/test_combat_text.py --sanitize
          python uw1/tools/i18n/test_map_notes.py --sanitize
      - name: UTF-8 scroll flow and real FreeType logical layout (no game assets)
        run: |
          python uw1/tools/i18n/test_scroll_text.py
          python uw1/tools/i18n/test_scroll_text.py --render
