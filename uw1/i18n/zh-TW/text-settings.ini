# =====================================================================
# Ultima Underworld 繁體中文版：高解析中文字的預設設定（P10T）。
# 說明與調整範例見同一資料夾的 SETTINGS.zh-TW.md。
#
# - 這是繁體中文的預設值。想自己調整，請把要改的那一行寫進玩家設定檔
#   uw1port.cfg（Windows 在 %APPDATA%\uw1port），那裡的設定優先於這裡。
# - 存成 UTF-8；以 # 開頭的行是註解。數值後面不要加註解。
# - 名稱與 Ultima VIII 中文化的 scummvm.ini 相同。單位是「遊戲像素」
#   （畫面寬 320），可以有小數，會依視窗大小自動換算。
#
# 也可以只改某一類文字，寫法是 font_cjk_<類別>_<項目>，例如：
#   font_cjk_message_size=6       下方訊息捲軸（含對話時的選項）
#   font_cjk_talk_line_spacing=1  對話框（NPC 說的話）
#   font_cjk_book_size=6          書本與卷軸（之後的版本才會以高解析顯示）
# 沒寫的項目沿用下面 font_cjk_hd_ 的設定。
# =====================================================================

# 【高解析】字型檔：放在 fonts 資料夾（位置見 SETTINGS.zh-TW.md 第四節）
font_cjk_hd_file=jf-openhuninn-2.1.ttf
# 【高解析】缺字時改用的字型檔；留空為不用（目前的譯文 jf open 粉圓都有）
font_cjk_hd_fallback_file=
# 【高解析】字級（2 到 16）
font_cjk_hd_size=5
# 【高解析】字與字之間多加的間距（-2 到 8）
font_cjk_hd_letter_spacing=0
# 【高解析】中文與英文字母、數字相接處再多加的間距（-2 到 8）
font_cjk_hd_latin_spacing=0
# 【高解析】行與行之間多加的間距（-3 到 16）。行距變大，一頁能放的行數就變少
font_cjk_hd_line_spacing=0
# 【高解析】文字往下移的距離，負數往上（-4 到 4）；只影響位置，不影響換行
font_cjk_hd_baseline=0
# 【高解析】文字黑框的粗細，0 為無黑框（0 到 2）
font_cjk_hd_border=0
# 【高解析】反鋸齒：true 平滑，false 不平滑（點陣感）
font_cjk_hd_antialiasing=true
